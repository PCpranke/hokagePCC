name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot pyautogui pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole prank.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: prank-pc
          path: dist/prank.exe
